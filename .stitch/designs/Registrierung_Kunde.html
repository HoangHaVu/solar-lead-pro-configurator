<body class="bg-surface-container-low min-h-screen flex flex-col font-body-md text-on-surface antialiased selection:bg-secondary-container selection:text-primary-container">
<!-- Minimal Header for Transactional Canvas -->
<header class="w-full h-20 px-6 flex items-center justify-between max-w-container-max mx-auto">
<a class="flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">solar_power</span>
<span class="text-2xl font-black text-primary-container tracking-tighter">SolarKonfigurator</span>
</a>
<a class="flex items-center gap-2 text-on-surface-variant hover:text-primary-container transition-colors font-label-md text-label-md" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
            Zurück
        </a>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 pb-section-padding">
<div class="w-full max-w-[520px]">
<!-- Contextual Header -->
<div class="mb-stack-md text-center">
<h1 class="font-headline-lg text-headline-lg text-primary-container mb-2">Kunden-Konto erstellen</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sichere deinen Konfigurationsstand und erhalte dein persönliches Angebot.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(13,33,55,0.05)] p-card-padding">
<form action="#" class="flex flex-col gap-stack-sm" method="POST">
<!-- Name Fields (Grid on larger screens) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-sm">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="vorname">Vorname</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="vorname" name="vorname" type="text" value="Max"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="nachname">Nachname</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="nachname" name="nachname" type="text" value="Mustermann"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-Mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="h-12 w-full pl-11 pr-4 rounded-lg border border-outline-variant bg-surface-container-low text-on-surface-variant font-body-md text-body-md cursor-not-allowed opacity-80" id="email" name="email" readonly="" type="email" value="max.mustermann@beispiel.de"/>
</div>
<p class="font-caption text-caption text-on-surface-variant flex items-center gap-1.5 mt-1">
<span class="material-symbols-outlined text-[14px] text-secondary-container">info</span>
                            Wir senden dir eine Bestätigungs-E-Mail
                        </p>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Passwort setzen</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="h-12 w-full pl-11 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="password" name="password" placeholder="Mindestens 8 Zeichen" type="password"/>
</div>
</div>
<!-- Submit Action -->
<button class="h-14 mt-6 w-full bg-secondary-container text-primary-container rounded-lg font-headline-md text-headline-md !text-[16px] flex items-center justify-center gap-2 hover:bg-[#F59E0B] hover:-translate-y-0.5 transition-all shadow-sm active:scale-[0.98]" type="submit">
                        Konto erstellen
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Trust Signal Integration -->
<div class="mt-stack-md pt-stack-sm border-t border-outline-variant/30 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<span class="font-caption text-caption">100% Datenschutz nach GDPR. Deine Daten sind sicher.</span>
</div>
</div>
</div>
